# Cloudflare Worker for the UntungLab licence server. See ../README.md for the steps.
name = "untunglab"
main = "index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "untunglab-license"
database_id = "dc555b55-abfe-415f-a730-b5645c72d5d0"

[vars]
PRICE_SEN = "4900"  # RM49 normal price
EARLY_BIRD_PRICE_SEN = "3900"               # RM39.00 for the first EARLY_BIRD_SLOTS paid orders (D-80). Set SLOTS to "0" to turn off.
EARLY_BIRD_SLOTS = "15"
TOYYIB_BASE_URL = "https://toyyibpay.com"   # production (sandbox is https://dev.toyyibpay.com). Testing live with RM1 (D-81)
TOYYIB_CATEGORY = "5gqeosjy"
PUBLIC_BASE_URL = "https://beli.untunglab.space" # this Worker's public address (custom domain)
APP_ORIGIN = "https://untunglab.space,https://svanistelrooy901-art.github.io"   # where the app is hosted (comma-separated)
APP_URL = "https://untunglab.space/"
BREVO_SENDER_EMAIL = "untunglab@digitalsambal.space"  # must be a sender verified in Brevo
BREVO_SENDER_NAME = "UntungLab"
# Visitor numbers on /admin (D-93). CF_BEACON_TOKEN = the "token" in the Web Analytics JS snippet (public).
# CF_ACCOUNT_ID = Cloudflare account id. CF_SITE_TAG is optional (without it, pages are picked by host name).
CF_BEACON_TOKEN = ""
CF_ACCOUNT_ID = ""
CF_SITE_TAG = ""

# Secrets (never in this file):
#   wrangler secret put TOYYIB_SECRET
#   wrangler secret put LICENSE_PRIVATE_KEY     (from scripts/gen-keys.mjs)
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put BREVO_API_KEY
#   wrangler secret put CF_ANALYTICS_TOKEN      (optional, D-93: API token with Account > Account Analytics > Read)

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
