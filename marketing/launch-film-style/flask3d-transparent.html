<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const W=800,H=900;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;document.body.appendChild(r.domElement);
const scene=new THREE.Scene();
// background gradient
const bc=document.createElement('canvas');bc.width=16;bc.height=512;const bx=bc.getContext('2d');const g=bx.createLinearGradient(0,0,0,512);g.addColorStop(0,'#0a3a42');g.addColorStop(0.55,'#041a1f');g.addColorStop(1,'#010608');bx.fillStyle=g;bx.fillRect(0,0,16,512);
const bt=new THREE.CanvasTexture(bc);bt.colorSpace=THREE.SRGBColorSpace;
const pm=new THREE.PMREMGenerator(r);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.9;
const cam=new THREE.PerspectiveCamera(30,W/H,0.1,100);cam.position.set(0,0.3,13.2);
// lights: mint rim from behind-left, warm key front-right
const k=new THREE.DirectionalLight(0xffffff,2.2);k.position.set(4,5,6);scene.add(k);
const rim=new THREE.PointLight(0x75f8e8,90,30);rim.position.set(-4,1,-3);scene.add(rim);
const rim2=new THREE.PointLight(0x4aa8ff,50,30);rim2.position.set(5,-2,-3);scene.add(rim2);
// flask profile (radius,y)
const prof=[[0.0,-1.95],[1.0,-1.95],[1.55,-1.9],[1.86,-1.7],[1.9,-1.45],[1.55,-0.35],[0.95,0.75],[0.56,1.45],[0.5,1.9],[0.5,2.4],[0.64,2.5],[0.64,2.64]].map(p=>new THREE.Vector2(p[0],p[1]));
const sm=new THREE.SplineCurve(prof).getPoints(120);const glassGeo=new THREE.LatheGeometry(sm,96);
const glass=new THREE.MeshPhysicalMaterial({color:0xd9fffb,metalness:0,roughness:0.04,transmission:1,thickness:0.5,ior:1.45,transparent:true,opacity:1,clearcoat:1,clearcoatRoughness:0.03,attenuationColor:new THREE.Color(0x75f8e8),attenuationDistance:6,side:THREE.DoubleSide,specularIntensity:1});
// liquid (inner), mint glowing
const lq=[[0,-1.82],[1.0,-1.82],[1.5,-1.78],[1.76,-1.6],[1.8,-1.4],[1.6,-0.8],[1.5,-0.55]].map(p=>new THREE.Vector2(p[0],p[1]));
const liq=new THREE.Mesh(new THREE.LatheGeometry(new THREE.SplineCurve(lq).getPoints(60),96),new THREE.MeshStandardMaterial({color:0x1fd2bd,emissive:0x0f9a8c,emissiveIntensity:0.9,roughness:0.25,metalness:0}));
const flask=new THREE.Group();flask.add(new THREE.Mesh(glassGeo,glass));flask.add(liq);
// liquid surface disc
const surf=new THREE.Mesh(new THREE.CircleGeometry(1.5,64),new THREE.MeshBasicMaterial({color:0xb9fff6}));surf.rotation.x=-Math.PI/2;surf.position.y=-0.55;flask.add(surf);
// $ emblem on a plane inside
function dollar(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,0)';x.fillRect(0,0,256,256);x.font='900 190px Inter, Arial';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#bffff8';x.shadowBlur=24;x.fillStyle='#eafffd';x.fillText('$',128,138);return new THREE.CanvasTexture(c)}
const dl=new THREE.Mesh(new THREE.PlaneGeometry(1.7,1.7),new THREE.MeshBasicMaterial({map:dollar(),alphaTest:0.4}));dl.position.set(0,-1.2,1.92);dl.rotation.x=-0.12;flask.add(dl);
// bubbles
const bm=new THREE.MeshStandardMaterial({color:0xeafffd,emissive:0x9ff7ee,emissiveIntensity:0.6,roughness:0.1});
[[0.7,-0.2,1.0,0.12],[-0.4,0.1,1.0,0.08],[0.2,0.45,1.0,0.055],[-0.8,-0.5,1.0,0.06]].forEach(b=>{const m=new THREE.Mesh(new THREE.SphereGeometry(b[3],24,24),bm);m.position.set(b[0],b[1],b[2]*0.9);flask.add(m)});
// face
const face=new THREE.Group();face.position.set(0,0.35,1.47);face.rotation.x=-0.5;
const eyeW=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.25,metalness:0});
const pupM=new THREE.MeshStandardMaterial({color:0x061214,roughness:0.2});
function eye(x,s=1,look=[0,0]){const e=new THREE.Group();const w=new THREE.Mesh(new THREE.SphereGeometry(0.30,48,48),eyeW);w.scale.set(1,1.18,0.55);e.add(w);const p=new THREE.Mesh(new THREE.SphereGeometry(0.135,32,32),pupM);p.position.set(look[0]*0.08,look[1]*0.08,0.12);p.scale.set(1,1,0.7);e.add(p);const hl=new THREE.Mesh(new THREE.SphereGeometry(0.04,16,16),new THREE.MeshBasicMaterial({color:0xffffff}));hl.position.set(look[0]*0.08+0.05,look[1]*0.08+0.07,0.2);e.add(hl);e.position.x=x;e.scale.setScalar(s);return e}
function brow(x,rot,y=0.42,len=0.5){const b=new THREE.Mesh(new THREE.CapsuleGeometry(0.05,len,8,16),new THREE.MeshStandardMaterial({color:0x061214,roughness:0.4}));b.rotation.z=Math.PI/2+rot;b.position.set(x,y,0.06);return b}
function setFace(kind){while(face.children.length)face.remove(face.children[0]);
  if(kind==='neutral'){face.add(eye(-0.42),eye(0.42),brow(-0.42,0.12),brow(0.42,-0.12))}
  if(kind==='happy'){face.add(eye(-0.42,1,[0,0.3]),eye(0.42,1,[0,0.3]),brow(-0.42,-0.14,0.52),brow(0.42,0.14,0.52))}
  if(kind==='wow'){face.add(eye(-0.44,1.18,[0.4,0.2]),eye(0.44,1.18,[0.4,0.2]),brow(-0.44,-0.1,0.62,0.4),brow(0.44,0.1,0.62,0.4))}
}
flask.add(face);scene.add(flask);
const pose=[['neutral',-5.3,0,-0.18],['happy',0,0.15,0.0],['wow',5.3,-0.1,0.2]];
for(const [k2,x,ry,rz] of pose){}
// ground reflection plane
const gr=new THREE.Mesh(new THREE.CircleGeometry(6,64),new THREE.MeshBasicMaterial({color:0x75f8e8,transparent:true,opacity:0.07}));gr.rotation.x=-Math.PI/2;gr.position.y=-1.95;
window.shot=(kind,rx,ry,rz,px)=>{setFace(kind);flask.rotation.set(rx,ry,rz);flask.position.x=px;r.render(scene,cam);return r.domElement.toDataURL('image/png')};
window.setPose=(kind,ry,rz,px,py=0)=>{setFace(kind);flask.rotation.set(0,ry,rz);flask.position.set(px,py,0)};
window.render1=()=>r.render(scene,cam);window.READY=true;
</script></body></html>
