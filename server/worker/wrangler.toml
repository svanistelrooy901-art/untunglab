# Cloudflare Worker for the UntungLab licence server. See ../README.md for the steps.
name = "untunglab-license"
main = "index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "untunglab-license"
database_id = "dc555b55-abfe-415f-a730-b5645c72d5d0"

[vars]
PRICE_SEN = "100"                          # RM49.00 in sen (D-80). Change here to change the price; no app update needed.  # SANDBOX TEST ONLY. Production: 4900
EARLY_BIRD_PRICE_SEN = "3900"               # RM39.00 for the first EARLY_BIRD_SLOTS paid orders (D-80). Set SLOTS to "0" to turn off.
EARLY_BIRD_SLOTS = "0"  # SANDBOX TEST ONLY. Production: "15"
TOYYIB_BASE_URL = "https://dev.toyyibpay.com"   # sandbox first; production is https://toyyibpay.com
TOYYIB_CATEGORY = "5gqeosjy"
PUBLIC_BASE_URL = "https://REPLACE.workers.dev" # this Worker's public address (or your own domain)
APP_ORIGIN = "https://svanistelrooy901-art.github.io"       # where the UntungLab app is hosted
APP_URL = "https://svanistelrooy901-art.github.io/untunglab/"
BREVO_SENDER_EMAIL = "REPLACE@your-domain.com"  # must be a sender verified in Brevo
BREVO_SENDER_NAME = "UntungLab"

# Secrets (never in this file):
#   wrangler secret put TOYYIB_SECRET
#   wrangler secret put LICENSE_PRIVATE_KEY     (from scripts/gen-keys.mjs)
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put BREVO_API_KEY
